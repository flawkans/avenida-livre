services:
  - type: web
    name: avenida-livre
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # login: o servidor confere a conta de cada jogador (valores públicos, os mesmos do index.html)
      - key: SUPABASE_URL
        value: https://zaluvwahhzqnvpuaapua.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_zGNk6rop0MNTnpxzVPgjtA_mPXcAotA
      # pagamento (Cakto): valores SECRETOS, preenchidos só no painel do Render (Environment), nunca aqui
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CAKTO_SECRET
        sync: false
      - key: CAKTO_PRODUCT_ID
        sync: false
